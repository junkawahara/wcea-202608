<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>虫食い算ドリル</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #EFEEE6;
    --card: #FBFAF3;
    --grid: rgba(61, 90, 153, .10);
    --ink: #2A3240;
    --ink-soft: #6B7285;
    --accent: #3D5A99;
    --accent-ink: #FFFFFF;
    --hole-bg: #EDEBDC;
    --hole-border: #B0AA8F;
    --red: #D6493A;
    --ring: rgba(61, 90, 153, .35);
    --shadow: 0 2px 14px rgba(42, 50, 64, .09);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #12161F;
      --card: #1B2230;
      --grid: rgba(136, 163, 226, .09);
      --ink: #E7EAF3;
      --ink-soft: #95A0B8;
      --accent: #88A3E2;
      --accent-ink: #0E1320;
      --hole-bg: #242E42;
      --hole-border: #4C5977;
      --red: #E97862;
      --ring: rgba(136, 163, 226, .4);
      --shadow: 0 2px 14px rgba(0, 0, 0, .35);
    }
  }
  :root[data-theme="dark"] {
    --paper: #12161F;
    --card: #1B2230;
    --grid: rgba(136, 163, 226, .09);
    --ink: #E7EAF3;
    --ink-soft: #95A0B8;
    --accent: #88A3E2;
    --accent-ink: #0E1320;
    --hole-bg: #242E42;
    --hole-border: #4C5977;
    --red: #E97862;
    --ring: rgba(136, 163, 226, .4);
    --shadow: 0 2px 14px rgba(0, 0, 0, .35);
  }

  *, *::before, *::after { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Yu Gothic", sans-serif;
    font-weight: 500;
    line-height: 1.6;
  }
  .wrap {
    max-width: 560px;
    margin: 0 auto;
    padding: 34px 16px 64px;
  }

  header { text-align: center; }
  h1 {
    margin: 0;
    font-size: clamp(1.9rem, 6.5vw, 2.5rem);
    font-weight: 900;
    letter-spacing: .05em;
    text-wrap: balance;
  }
  .tagline {
    margin: 6px 0 0;
    color: var(--ink-soft);
    font-size: .95rem;
  }

  .controls {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    margin: 22px 0 14px;
  }
  .seg {
    display: inline-flex;
    gap: 4px;
    padding: 4px;
    border-radius: 999px;
    background: color-mix(in srgb, var(--ink) 7%, transparent);
  }
  .seg button {
    border: none;
    border-radius: 999px;
    padding: 7px 15px;
    font: inherit;
    font-weight: 700;
    color: var(--ink-soft);
    background: transparent;
    cursor: pointer;
  }
  .seg button[aria-pressed="true"] {
    background: var(--card);
    color: var(--accent);
    box-shadow: 0 1px 4px rgba(0, 0, 0, .12);
  }

  .btn {
    font: inherit;
    font-weight: 700;
    border-radius: 999px;
    padding: 9px 20px;
    border: 2px solid transparent;
    cursor: pointer;
    transition: background-color .15s, color .15s;
  }
  .btn.primary { background: var(--accent); color: var(--accent-ink); }
  .btn.primary:hover { background: color-mix(in srgb, var(--accent) 88%, var(--ink)); }
  .btn.ghost {
    background: transparent;
    border-color: color-mix(in srgb, var(--accent) 40%, transparent);
    color: var(--accent);
  }
  .btn.ghost:hover { background: color-mix(in srgb, var(--accent) 10%, transparent); }
  .btn:disabled { opacity: .4; cursor: default; }
  .btn:disabled:hover { background: transparent; }
  .btn.primary:disabled:hover { background: var(--accent); }
  button:focus-visible, input:focus-visible {
    outline: 3px solid var(--ring);
    outline-offset: 2px;
  }

  .page-card {
    background-color: var(--card);
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 22px 22px;
    border: 1px solid color-mix(in srgb, var(--ink) 9%, transparent);
    border-radius: 14px;
    padding: 18px 20px 22px;
    box-shadow: var(--shadow);
  }
  .card-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
  }
  .badge {
    display: inline-block;
    padding: 2px 14px;
    border-radius: 999px;
    background: color-mix(in srgb, var(--accent) 13%, transparent);
    color: var(--accent);
    font-weight: 700;
    font-size: .9rem;
  }
  .score {
    color: var(--ink-soft);
    font-weight: 700;
    font-size: .9rem;
    font-variant-numeric: tabular-nums;
  }

  .calc-center {
    display: flex;
    justify-content: center;
    padding: 30px 0 22px;
  }
  .calc-holder { position: relative; }
  #calc {
    --cell: clamp(40px, 11vw, 54px);
    display: inline-flex;
    flex-direction: column;
  }
  .row { display: flex; gap: 6px; }
  .cell {
    width: var(--cell);
    height: var(--cell);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: calc(var(--cell) * .52);
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .sign { color: var(--ink-soft); }
  .rule {
    align-self: stretch;
    height: 3.5px;
    margin: 7px 0;
    border-radius: 2px;
    background: var(--ink);
  }

  input.hole {
    padding: 0;
    text-align: center;
    font: inherit;
    font-size: calc(var(--cell) * .52);
    font-weight: 700;
    color: var(--accent);
    caret-color: var(--accent);
    background: var(--hole-bg);
    border: 2px dashed var(--hole-border);
  }
  .hs0 { border-radius: 42% 58% 50% 50% / 55% 45% 60% 40%; }
  .hs1 { border-radius: 55% 45% 58% 42% / 45% 55% 42% 58%; }
  .hs2 { border-radius: 50% 50% 45% 55% / 60% 42% 55% 45%; }
  .hs3 { border-radius: 46% 54% 52% 48% / 48% 58% 44% 56%; }
  input.hole:focus { outline: 3px solid var(--ring); outline-offset: 1px; }
  input.hole.hint {
    border-style: solid;
    border-color: var(--accent);
    background: color-mix(in srgb, var(--accent) 10%, transparent);
  }
  input.hole.revealed {
    border-style: solid;
    border-color: var(--ink-soft);
    color: var(--ink-soft);
    background: transparent;
  }
  input.hole.wrong {
    border-style: solid;
    border-color: var(--red);
    color: var(--red);
    background: color-mix(in srgb, var(--red) 10%, var(--hole-bg));
    animation: shake .35s;
  }
  input.hole.ok {
    border-style: solid;
    border-color: color-mix(in srgb, var(--red) 50%, transparent);
    color: var(--ink);
    background: transparent;
  }
  @keyframes shake {
    20%, 60% { transform: translateX(-3px); }
    40%, 80% { transform: translateX(3px); }
  }

  #maru {
    position: absolute;
    inset: -20px -30px;
    width: calc(100% + 60px);
    height: calc(100% + 40px);
    pointer-events: none;
  }
  #maru path {
    fill: none;
    stroke: var(--red);
    stroke-width: 4.5;
    stroke-linecap: round;
    vector-effect: non-scaling-stroke;
    opacity: .85;
    stroke-dasharray: 300;
    stroke-dashoffset: 300;
  }
  .celebrate #maru path {
    animation: drawMaru .7s cubic-bezier(.5, 0, .3, 1) .1s forwards;
  }
  @keyframes drawMaru { to { stroke-dashoffset: 0; } }

  .msg {
    min-height: 1.6em;
    margin: 4px 0 12px;
    text-align: center;
    color: var(--ink-soft);
    font-size: .95rem;
  }
  .msg.good { color: var(--red); font-weight: 900; font-size: 1.1rem; }
  .msg.bad { color: var(--ink); }

  .actions {
    display: flex;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
  }

  .note {
    margin: 14px 4px 0;
    color: var(--ink-soft);
    font-size: .82rem;
    text-align: center;
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: .01ms !important; transition: none !important; }
  }
</style>

</head>
<body>
<main class="wrap">
  <header>
    <h1>虫食い算ドリル</h1>
    <p class="tagline">虫に食われた □ に数字を入れて、筆算を完成させよう。</p>
  </header>

  <section class="controls">
    <div class="seg" role="group" aria-label="難しさ">
      <button data-level="easy" aria-pressed="true">やさしい</button>
      <button data-level="normal" aria-pressed="false">ふつう</button>
      <button data-level="hard" aria-pressed="false">むずかしい</button>
    </div>
    <button id="newBtn" class="btn ghost">新しい問題</button>
  </section>

  <section class="page-card">
    <div class="card-top">
      <span class="badge" id="opBadge">たし算</span>
      <span class="score" id="score">正解 0 問</span>
    </div>
    <div class="calc-center">
      <div class="calc-holder" id="calcWrap">
        <div id="calc" aria-label="筆算"></div>
        <svg id="maru" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
          <path d="M50 5 C 79 3 96 21 95 49 C 94 78 77 95 50 95 C 22 95 5 77 5 50 C 5 22 23 8 58 7" pathLength="300"/>
        </svg>
      </div>
    </div>
    <p id="msg" class="msg" role="status" aria-live="polite"></p>
    <div class="actions">
      <button id="hintBtn" class="btn ghost">ヒント</button>
      <button id="checkBtn" class="btn primary">答え合わせ</button>
      <button id="revealBtn" class="btn ghost">答えを見る</button>
    </div>
  </section>

  <p class="note">※ マスごとに入る数字はばらばらです。答えは必ず 1 通りに決まります。</p>
</main>
<script>
'use strict';
// ---- 虫食い算 生成・検証ロジック (DOM 非依存) ----

function randInt(lo, hi) { return lo + Math.floor(Math.random() * (hi - lo + 1)); }
function randDigits(n) { return randInt(Math.pow(10, n - 1), Math.pow(10, n) - 1); }
function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

// 筆算の行構造。row: {digits, shift, sign} または {line: true}
// 行 0, 1 は常にオペランド行。
function buildRows(a, b, op) {
  const rows = [];
  if (op === '+') {
    rows.push({ digits: String(a), shift: 0, sign: null });
    rows.push({ digits: String(b), shift: 0, sign: '+' });
    rows.push({ line: true });
    rows.push({ digits: String(a + b), shift: 0, sign: null });
    return rows;
  }
  const bs = String(b);
  rows.push({ digits: String(a), shift: 0, sign: null });
  rows.push({ digits: bs, shift: 0, sign: '×' });
  rows.push({ line: true });
  if (bs.length === 1) {
    rows.push({ digits: String(a * b), shift: 0, sign: null });
  } else {
    rows.push({ digits: String(a * (b % 10)), shift: 0, sign: null });
    rows.push({ digits: String(a * Math.floor(b / 10)), shift: 1, sign: null });
    rows.push({ line: true });
    rows.push({ digits: String(a * b), shift: 0, sign: null });
  }
  return rows;
}

function digitCells(rows) {
  const cells = [];
  rows.forEach((row, r) => {
    if (row.line) return;
    for (let p = 0; p < row.digits.length; p++) {
      cells.push({ r, p, key: r + ':' + p, isOperand: r <= 1 });
    }
  });
  return cells;
}

// 隠したオペランド桁に 0-9 を代入した候補値の一覧 (先頭 0 は除外)
function candidates(str, hiddenPos) {
  const res = [];
  const arr = str.split('');
  const n = hiddenPos.length;
  const total = Math.pow(10, n);
  for (let c = 0; c < total; c++) {
    let x = c, ok = true;
    for (let i = 0; i < n; i++) {
      const d = x % 10; x = Math.floor(x / 10);
      if (d === 0 && hiddenPos[i] === 0) { ok = false; break; }
      arr[hiddenPos[i]] = String(d);
    }
    if (ok) res.push(parseInt(arr.join(''), 10));
  }
  return res;
}

function rowMatches(row, rIdx, mask, str) {
  if (str.length !== row.digits.length) return false;
  for (let p = 0; p < str.length; p++) {
    if (!mask.has(rIdx + ':' + p) && str[p] !== row.digits[p]) return false;
  }
  return true;
}

function checkDerived(rows, mask, op, a, b) {
  if (op === '+') return rowMatches(rows[3], 3, mask, String(a + b));
  if (rows.length === 4) return rowMatches(rows[3], 3, mask, String(a * b));
  return rowMatches(rows[3], 3, mask, String(a * (b % 10)))
      && rowMatches(rows[4], 4, mask, String(a * Math.floor(b / 10)))
      && rowMatches(rows[6], 6, mask, String(a * b));
}

// 空欄の埋め方が何通りあるか (limit で打ち切り)。導出行はオペランドで決まるため
// オペランドの空欄のみ列挙すれば全解を数え上げられる。
function countSolutions(rows, mask, op, limit) {
  const aStr = rows[0].digits, bStr = rows[1].digits;
  const aHidden = [], bHidden = [];
  for (let p = 0; p < aStr.length; p++) if (mask.has('0:' + p)) aHidden.push(p);
  for (let p = 0; p < bStr.length; p++) if (mask.has('1:' + p)) bHidden.push(p);
  const aCands = candidates(aStr, aHidden);
  const bCands = candidates(bStr, bHidden);
  let count = 0;
  for (const a of aCands) {
    for (const b of bCands) {
      if (checkDerived(rows, mask, op, a, b) && ++count >= limit) return count;
    }
  }
  return count;
}

const LEVELS = {
  easy: {
    label: 'やさしい', hideProb: 0.45, maxOpHidden: 3, minHidden: 3,
    pick() {
      const ad = randInt(2, 3), bd = randInt(2, ad);
      return { a: randDigits(ad), b: randDigits(bd), op: '+' };
    }
  },
  normal: {
    label: 'ふつう', hideProb: 0.55, maxOpHidden: 3, minHidden: 4,
    pick() {
      if (Math.random() < 0.5) {
        const ad = randInt(3, 4), bd = randInt(3, ad);
        return { a: randDigits(ad), b: randDigits(bd), op: '+' };
      }
      return { a: randDigits(randInt(2, 3)), b: randInt(2, 9), op: '×' };
    }
  },
  hard: {
    label: 'むずかしい', hideProb: 0.6, maxOpHidden: 4, minHidden: 6,
    pick() {
      const a = randDigits(randInt(2, 3));
      const b = randInt(1, 9) * 10 + randInt(1, 9); // 両桁とも 0 以外
      return { a, b, op: '×' };
    }
  }
};

function randomMask(cells, cfg) {
  const target = Math.max(cfg.minHidden, Math.round(cells.length * cfg.hideProb));
  const shuffled = shuffle(cells.slice());
  const mask = new Set();
  let opCount = 0;
  for (const c of shuffled) {
    if (mask.size >= target) break;
    if (c.isOperand) {
      if (opCount >= cfg.maxOpHidden) continue;
      opCount++;
    }
    mask.add(c.key);
  }
  if (opCount === 0) {
    const opCells = cells.filter(c => c.isOperand);
    mask.add(opCells[Math.floor(Math.random() * opCells.length)].key);
  }
  return mask;
}

// 解が一意になる問題だけを返す
function generatePuzzle(levelKey) {
  const cfg = LEVELS[levelKey];
  for (let t = 0; t < 400; t++) {
    const { a, b, op } = cfg.pick();
    const rows = buildRows(a, b, op);
    const cells = digitCells(rows);
    for (let mt = 0; mt < 20; mt++) {
      const mask = randomMask(cells, cfg);
      if (countSolutions(rows, mask, op, 2) === 1) return { rows, mask, op, a, b };
    }
  }
  // 保険: 空欄 1 つなら必ず一意に近い。オペランド 1 桁 → 結果 1 桁の順に試す。
  const { a, b, op } = cfg.pick();
  const rows = buildRows(a, b, op);
  const all = digitCells(rows);
  for (const c of all.filter(c => c.isOperand)) {
    const mask = new Set([c.key]);
    if (countSolutions(rows, mask, op, 2) === 1) return { rows, mask, op, a, b };
  }
  const rc = all.find(c => !c.isOperand);
  return { rows, mask: new Set([rc.key]), op, a, b };
}
// ---- 画面制御 ----
(function () {
  const $ = id => document.getElementById(id);
  const calcEl = $('calc'), msgEl = $('msg'), scoreEl = $('score'), opBadge = $('opBadge');
  const hintBtn = $('hintBtn'), checkBtn = $('checkBtn'), revealBtn = $('revealBtn'), newBtn = $('newBtn');
  const wrapEl = $('calcWrap');

  let puzzle = null, level = 'easy', hintsUsed = 0, finished = false;
  let solvedCount = 0;
  try { solvedCount = parseInt(localStorage.getItem('mushikui-solved'), 10) || 0; } catch (e) {}

  function saveScore() { try { localStorage.setItem('mushikui-solved', String(solvedCount)); } catch (e) {} }
  function updateScore() { scoreEl.textContent = '正解 ' + solvedCount + ' 問'; }

  const HOLE_SHAPES = ['hs0', 'hs1', 'hs2', 'hs3'];

  function pad() { const s = document.createElement('span'); s.className = 'cell pad'; return s; }

  function render() {
    const rows = puzzle.rows;
    let W = 0;
    rows.forEach(r => { if (!r.line) W = Math.max(W, r.digits.length + r.shift); });
    calcEl.innerHTML = '';
    rows.forEach((row, r) => {
      if (row.line) {
        const d = document.createElement('div');
        d.className = 'rule';
        calcEl.appendChild(d);
        return;
      }
      const rowEl = document.createElement('div');
      rowEl.className = 'row';
      const sign = document.createElement('span');
      sign.className = 'cell sign';
      sign.textContent = row.sign || '';
      rowEl.appendChild(sign);
      for (let i = 0; i < W - row.digits.length - row.shift; i++) rowEl.appendChild(pad());
      for (let p = 0; p < row.digits.length; p++) {
        const key = r + ':' + p;
        if (puzzle.mask.has(key)) {
          const inp = document.createElement('input');
          inp.className = 'cell hole ' + HOLE_SHAPES[Math.floor(Math.random() * HOLE_SHAPES.length)];
          inp.type = 'text';
          inp.inputMode = 'numeric';
          inp.maxLength = 1;
          inp.autocomplete = 'off';
          inp.dataset.key = key;
          inp.setAttribute('aria-label', '空欄マス');
          rowEl.appendChild(inp);
        } else {
          const s = document.createElement('span');
          s.className = 'cell digit';
          s.textContent = row.digits[p];
          rowEl.appendChild(s);
        }
      }
      for (let i = 0; i < row.shift; i++) rowEl.appendChild(pad());
      calcEl.appendChild(rowEl);
    });
  }

  function holes() { return Array.from(calcEl.querySelectorAll('input.hole')); }
  function solutionFor(inp) {
    const [r, p] = inp.dataset.key.split(':').map(Number);
    return puzzle.rows[r].digits[p];
  }

  function msg(text, cls) {
    msgEl.textContent = text;
    msgEl.className = 'msg' + (cls ? ' ' + cls : '');
  }

  function setButtons(enabled) {
    hintBtn.disabled = checkBtn.disabled = revealBtn.disabled = !enabled;
  }

  function newPuzzle() {
    puzzle = generatePuzzle(level);
    hintsUsed = 0;
    finished = false;
    wrapEl.classList.remove('celebrate');
    msg('');
    opBadge.textContent = puzzle.op === '+' ? 'たし算' : 'かけ算';
    setButtons(true);
    render();
    const first = holes()[0];
    if (first) first.focus();
  }

  calcEl.addEventListener('input', e => {
    const inp = e.target;
    if (!inp.classList.contains('hole') || finished) return;
    let v = inp.value.replace(/[０-９]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0xFEE0));
    v = (v.match(/[0-9]/g) || []).pop() || '';
    inp.value = v;
    inp.classList.remove('wrong', 'ok');
    msg('');
    if (!v) return;
    const hs = holes();
    const next = hs.slice(hs.indexOf(inp) + 1).find(h => !h.value) || hs.find(h => !h.value);
    if (next) next.focus();
    else check(true);
  });

  calcEl.addEventListener('keydown', e => {
    const inp = e.target;
    if (!inp.classList.contains('hole')) return;
    const hs = holes(), i = hs.indexOf(inp);
    if (e.key === 'Backspace' && !inp.value && i > 0) {
      const prev = hs[i - 1];
      prev.focus();
      if (!prev.readOnly) { prev.value = ''; prev.classList.remove('wrong', 'ok'); }
      e.preventDefault();
    } else if (e.key === 'ArrowLeft' && i > 0) {
      hs[i - 1].focus(); e.preventDefault();
    } else if (e.key === 'ArrowRight' && i < hs.length - 1) {
      hs[i + 1].focus(); e.preventDefault();
    } else if (e.key === 'Enter') {
      check(false);
    }
  });

  function check(auto) {
    if (finished) return;
    let empty = 0, wrong = 0;
    for (const inp of holes()) {
      inp.classList.remove('wrong', 'ok');
      if (!inp.value) { empty++; continue; }
      if (inp.value === solutionFor(inp)) inp.classList.add('ok');
      else { inp.classList.add('wrong'); wrong++; }
    }
    if (!empty && !wrong) { win(); return; }
    if (auto) {
      if (!empty) msg('おしい！赤いマスをもう一度考えてみよう。', 'bad');
      return;
    }
    if (empty) msg('まだ空いているマスが ' + empty + ' 個あります。');
    else msg('赤いマスが ' + wrong + ' 個。もう一度考えてみよう。', 'bad');
  }

  function win() {
    finished = true;
    solvedCount++;
    saveScore();
    updateScore();
    for (const inp of holes()) { inp.classList.add('ok'); inp.readOnly = true; }
    setButtons(false);
    wrapEl.classList.add('celebrate');
    msg(hintsUsed ? '正解！（ヒント ' + hintsUsed + ' 回）' : '正解！ノーヒント、おみごと！', 'good');
  }

  hintBtn.addEventListener('click', () => {
    if (finished) return;
    const cand = holes().filter(h => !h.readOnly && (!h.value || h.value !== solutionFor(h)));
    if (!cand.length) return;
    const inp = cand[Math.floor(Math.random() * cand.length)];
    inp.value = solutionFor(inp);
    inp.classList.remove('wrong', 'ok');
    inp.classList.add('hint');
    inp.readOnly = true;
    hintsUsed++;
    if (holes().every(h => h.value)) check(true);
    else msg('ヒント：1 マス埋めました。');
  });

  checkBtn.addEventListener('click', () => check(false));

  revealBtn.addEventListener('click', () => {
    finished = true;
    for (const inp of holes()) {
      if (inp.value !== solutionFor(inp)) {
        inp.value = solutionFor(inp);
        inp.classList.remove('wrong', 'ok', 'hint');
        inp.classList.add('revealed');
      }
      inp.readOnly = true;
    }
    setButtons(false);
    msg('答えを表示しました。「新しい問題」で再挑戦！');
  });

  newBtn.addEventListener('click', newPuzzle);

  document.querySelectorAll('.seg button').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.seg button').forEach(b =>
        b.setAttribute('aria-pressed', b === btn ? 'true' : 'false'));
      level = btn.dataset.level;
      newPuzzle();
    });
  });

  updateScore();
  newPuzzle();
})();
</script>
</body>
</html>
